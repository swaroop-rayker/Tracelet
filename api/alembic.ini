[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

# Timestamped, ordered filenames. Alembic revision hashes sort arbitrarily,
# which makes a directory listing useless for reading history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# The URL is supplied at runtime from TRACELET_MIGRATE_DATABASE_URL by
# alembic/env.py, so no credentials live in this file. Migrations connect as
# tracelet_migrate — the DDL-only role (docs/DATA_MODEL.md §12).
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
