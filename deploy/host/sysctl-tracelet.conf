# Tracelet host baseline (ADR-0026). Installed as /etc/sysctl.d/60-tracelet.conf by
# `./scripts/tl host-setup`.
#
# Prefer dropping page cache (cheap to re-read) over swapping out program memory. With
# Debian's default of 60, each gunicorn worker on the e2-micro had about 40 % of its
# memory in swap on the network disk while 426 MB was page cache, and dockerd was swapped
# too (docs/ERRORS.md E79).
vm.swappiness = 10
